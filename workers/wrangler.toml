name = "japoint-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "japoint-payments"
database_id = "YOUR_DATABASE_ID"  # Replace after creating DB with: wrangler d1 create japoint-payments

# CORS settings for GitHub Pages / Cloudflare Pages
[vars]
ALLOWED_ORIGINS = "https://kkuejo.github.io,https://japoint.pages.dev"

# Routes (optional - for custom domain)
# routes = [
#   { pattern = "api.japoint.example.com/*", zone_name = "example.com" }
# ]
