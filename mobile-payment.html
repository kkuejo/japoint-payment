<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAPOINT 決済</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .shop-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .shop-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .fee-info {
            font-size: 12px;
            color: #666;
        }

        .amount-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        input[type="text"]#amount {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .breakdown {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #666;
        }

        .breakdown-row.total {
            border-top: 2px solid #ddd;
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .reward {
            color: #4CAF50;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .pay-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .pay-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .pay-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .connect-button {
            background: #FF6B35;
            color: white;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .wallet-info {
            background: #fff3cd;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
            color: #856404;
        }

        .balance-info {
            background: #e8f5e9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .balance-label {
            font-size: 12px;
            color: #666;
        }

        .balance-amount {
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💳 JAPOINT 決済</h1>
        <p class="subtitle">1回の承認で完了！</p>

        <div id="shopInfo" class="shop-info">
            <div class="shop-name" id="shopName">ショップ名</div>
            <div class="fee-info">手数料率: <span id="feeRate">-</span></div>
        </div>

        <div id="walletSection">
            <button class="connect-button" id="connectButton">
                📱 MetaMaskで接続
            </button>
            <div class="wallet-info">
                MetaMask Mobileのブラウザで開いてください
            </div>
            <div id="diagnosticInfo" style="margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 5px; font-size: 12px; display: none;">
                <div id="diagnosticText"></div>
            </div>
        </div>

        <div id="paymentSection" class="hidden">
            <div class="balance-info" id="balanceInfo"></div>

            <div class="amount-section">
                <label for="amount">支払い金額（JPYC）</label>
                <input
                    type="text"
                    id="amount"
                    inputmode="numeric"
                    pattern="[0-9,]*"
                    placeholder=""
                    oninput="formatAmountInput(this)"
                >
            </div>

            <div class="breakdown" id="breakdown">
                <div class="breakdown-row">
                    <span>お支払い額:</span>
                    <span id="totalAmount">0 JPYC</span>
                </div>
                <div class="breakdown-row">
                    <span>ショップ受取額:</span>
                    <span id="shopAmount">0 JPYC</span>
                </div>
                <div class="breakdown-row">
                    <span>手数料:</span>
                    <span id="feeAmount">0 JPYC</span>
                </div>
                <div class="breakdown-row total reward">
                    <span>🎁 獲得ポイント:</span>
                    <span id="rewardAmount">0 JAPT</span>
                </div>
            </div>

            <button class="pay-button" id="payButton" onclick="pay()" disabled>
                支払う
            </button>

            <div id="status"></div>
        </div>
    </div>

    <script>
        // URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const config = {
            shopName: urlParams.get('shop') || 'テストショップ',
            contractType: urlParams.get('type') || 'transfer10', // transfer10 or transfer5
            jpydAddress: urlParams.get('jpyd'),
            wrapperAddress: urlParams.get('wrapper'),
            targetAddress: urlParams.get('target'),
            japtAddress: urlParams.get('japt')
        };

        // ABIs (simplified - Sepolia JPYC doesn't support Permit)
        const JPYC_ABI = [
            "function balanceOf(address account) external view returns (uint256)",
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function allowance(address owner, address spender) external view returns (uint256)"
        ];

        const WRAPPER_ABI = [
            "function transfer(address to, uint256 amount) external returns (bool)"
        ];

        const JAPT_ABI = [
            "function balanceOf(address account) external view returns (uint256)"
        ];

        let provider;
        let signer;
        let userAddress;
        let jpydContract;
        let wrapperContract;
        let japtContract;

        // Set fee rate
        const feeRate = config.contractType === 'transfer5' ? 0.5 : 1.0;
        document.getElementById('feeRate').textContent = feeRate + '%';
        document.getElementById('shopName').textContent = config.shopName;

        async function connectWallet() {
            console.log('=== connectWallet called ===');
            showDiagnostic('🔄 connectWallet関数が呼び出されました');
            try {
                // Check if ethers.js is loaded
                console.log('ethers available:', typeof ethers !== 'undefined');
                if (typeof ethers === 'undefined') {
                    showDiagnostic('❌ ethers.js未読み込み', true);
                    showStatus('エラー: ethers.jsライブラリが読み込まれていません。ページを再読み込みしてください。', 'error');
                    return;
                }
                showDiagnostic('✅ ethers.js確認OK');

                // Check if MetaMask is available
                console.log('window.ethereum available:', typeof window.ethereum !== 'undefined');
                console.log('window.ethereum:', window.ethereum);

                if (typeof window.ethereum === 'undefined') {
                    showDiagnostic('❌ window.ethereum未検出', true);
                    showStatus('MetaMaskがインストールされていません。MetaMask Mobileのブラウザで開いてください。', 'error');
                    return;
                }
                showDiagnostic('✅ window.ethereum確認OK');

                // Check if addresses are provided
                console.log('config:', config);
                console.log('jpydAddress:', config.jpydAddress);
                console.log('wrapperAddress:', config.wrapperAddress);
                console.log('targetAddress:', config.targetAddress);

                if (!config.jpydAddress || !config.wrapperAddress || !config.targetAddress) {
                    showDiagnostic('❌ コントラクトアドレス不足', true);
                    showStatus('エラー: コントラクトアドレスがURLパラメータに含まれていません', 'error');
                    return;
                }
                showDiagnostic('✅ コントラクトアドレス確認OK');

                console.log('Creating Web3Provider...');
                showDiagnostic('🔄 Web3Provider作成中...');
                provider = new ethers.providers.Web3Provider(window.ethereum);
                showDiagnostic('✅ Web3Provider作成成功');

                console.log('Requesting accounts...');
                showDiagnostic('🔄 MetaMaskにアカウント接続要求中...');
                showStatus('MetaMaskに接続中...', 'info');
                await provider.send("eth_requestAccounts", []);
                showDiagnostic('✅ アカウント接続許可取得');

                console.log('Getting signer...');
                showDiagnostic('🔄 Signer取得中...');
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                console.log('Connected address:', userAddress);
                showDiagnostic('✅ 接続成功: ' + userAddress.substring(0, 10) + '...');

                // Initialize contracts
                console.log('Initializing contracts...');
                showDiagnostic('🔄 コントラクト初期化中...');
                jpydContract = new ethers.Contract(config.jpydAddress, JPYC_ABI, signer);
                wrapperContract = new ethers.Contract(config.wrapperAddress, WRAPPER_ABI, signer);
                if (config.japtAddress) {
                    japtContract = new ethers.Contract(config.japtAddress, JAPT_ABI, provider);
                }
                showDiagnostic('✅ コントラクト初期化完了');

                // Show payment section
                document.getElementById('walletSection').classList.add('hidden');
                document.getElementById('paymentSection').classList.remove('hidden');

                // Load balances
                console.log('Loading balances...');
                showDiagnostic('🔄 残高読み込み中...');
                await updateBalances();
                showDiagnostic('✅ 残高読み込み完了');

                showStatus('接続完了！金額を入力して支払いを開始してください', 'success');
                showDiagnostic('🎉 接続プロセス完了！');
                console.log('=== Connection successful ===');
            } catch (error) {
                console.error('=== Connection error ===');
                console.error('Error details:', error);
                console.error('Error message:', error.message);
                console.error('Error stack:', error.stack);
                showDiagnostic('❌ エラー: ' + error.message, true);
                showStatus('接続エラー: ' + error.message, 'error');
            }
        }

        // Format number with commas (integer only)
        function formatWithCommas(num) {
            return Math.floor(num).toLocaleString('ja-JP');
        }

        // Format amount input with commas as user types
        function formatAmountInput(input) {
            // Get cursor position
            const cursorPos = input.selectionStart;
            const oldLength = input.value.length;

            // Remove non-numeric characters except for processing
            let rawValue = input.value.replace(/[^\d]/g, '');

            // Format with commas
            if (rawValue) {
                input.value = parseInt(rawValue, 10).toLocaleString('ja-JP');
            } else {
                input.value = '';
            }

            // Adjust cursor position after formatting
            const newLength = input.value.length;
            const diff = newLength - oldLength;
            const newCursorPos = Math.max(0, cursorPos + diff);
            input.setSelectionRange(newCursorPos, newCursorPos);

            // Update breakdown
            updateBreakdown();
        }

        // Get raw numeric value from formatted input
        function getAmountValue() {
            const input = document.getElementById('amount');
            const rawValue = input.value.replace(/[^\d]/g, '');
            return rawValue ? parseInt(rawValue, 10) : 0;
        }

        async function updateBalances() {
            try {
                const jpycBalance = await jpydContract.balanceOf(userAddress);
                const jpycFormatted = formatWithCommas(parseFloat(ethers.utils.formatEther(jpycBalance)));
                let balanceHTML = `
                    <div class="balance-label">JPYC残高</div>
                    <div class="balance-amount">${jpycFormatted} JPYC</div>
                `;

                if (japtContract) {
                    const japtBalance = await japtContract.balanceOf(userAddress);
                    const japtFormatted = formatWithCommas(parseFloat(ethers.utils.formatEther(japtBalance)));
                    balanceHTML += `
                        <div class="balance-label" style="margin-top: 10px;">JAPT残高</div>
                        <div class="balance-amount" style="color: #4CAF50;">${japtFormatted} JAPT</div>
                    `;
                }

                document.getElementById('balanceInfo').innerHTML = balanceHTML;
            } catch (error) {
                console.error('Balance update error:', error);
            }
        }

        function updateBreakdown() {
            const amount = getAmountValue();

            const feePercentage = config.contractType === 'transfer5' ? 0.005 : 0.01;
            const fee = amount * feePercentage;
            const shopReceives = amount - fee;
            const reward = fee; // Same as fee amount in JAPT

            document.getElementById('totalAmount').textContent = formatWithCommas(amount) + ' JPYC';
            document.getElementById('shopAmount').textContent = formatWithCommas(shopReceives) + ' JPYC';
            document.getElementById('feeAmount').textContent = formatWithCommas(fee) + ' JPYC';
            document.getElementById('rewardAmount').textContent = formatWithCommas(reward) + ' JAPT';

            // Enable/disable pay button
            document.getElementById('payButton').disabled = amount <= 0;
        }

        async function pay() {
            const amount = getAmountValue();
            if (!amount || amount <= 0) {
                showStatus('金額を入力してください', 'error');
                return;
            }

            const amountWei = ethers.utils.parseEther(amount.toString());

            try {
                document.getElementById('payButton').disabled = true;

                // Use approve+transfer method (Sepolia JPYC doesn't support Permit)
                const success = await tryApproveMethod(amountWei);

                if (success) {
                    showStatus('✅ 決済完了！JAPTポイントを獲得しました！', 'success');

                    // Update balances
                    await updateBalances();

                    // Clear amount
                    document.getElementById('amount').value = '';
                    updateBreakdown();
                }

                setTimeout(() => {
                    document.getElementById('payButton').disabled = false;
                }, 2000);

            } catch (error) {
                console.error(error);
                let errorMsg = error.message;

                if (error.code === 4001) {
                    errorMsg = 'ユーザーがトランザクションを拒否しました';
                } else if (error.message.includes('insufficient funds')) {
                    errorMsg = 'JPYC残高が不足しています';
                } else if (error.message.includes('transfer amount exceeds balance')) {
                    errorMsg = 'JPYC残高が不足しています';
                } else if (error.message.includes('user rejected')) {
                    errorMsg = 'トランザクションがキャンセルされました';
                }

                showStatus('❌ エラー: ' + errorMsg, 'error');
                document.getElementById('payButton').disabled = false;
            }
        }

        async function tryApproveMethod(amountWei) {
            try {
                showStatus('承認を要求中... <div class="loading"></div>', 'info');

                // First approve the wrapper to spend tokens
                const approveTx = await jpydContract.approve(config.wrapperAddress, amountWei);
                showStatus('承認トランザクション確認中... <div class="loading"></div>', 'info');
                await approveTx.wait();

                showStatus('決済を実行中... <div class="loading"></div>', 'info');

                // Then use wrapper's transfer function
                const tx = await wrapperContract.transfer(config.targetAddress, amountWei);

                showStatus('トランザクション送信完了！確認中... <div class="loading"></div>', 'info');

                await tx.wait();
                return true;

            } catch (error) {
                console.error('Approve method failed:', error);
                throw error;
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
            status.innerHTML = message;
        }

        // Diagnostic info display
        function showDiagnostic(message, isError = false) {
            const diagnosticDiv = document.getElementById('diagnosticInfo');
            const textDiv = document.getElementById('diagnosticText');
            diagnosticDiv.style.display = 'block';
            diagnosticDiv.style.background = isError ? '#ffebee' : '#e3f2fd';
            diagnosticDiv.style.border = isError ? '2px solid #f44336' : '2px solid #2196F3';

            const time = new Date().toLocaleTimeString();
            textDiv.innerHTML += `<div style="margin: 5px 0;">[${time}] ${message}</div>`;
        }

        // Diagnostic check on page load
        window.addEventListener('load', async () => {
            console.log('=== Page loaded ===');
            showDiagnostic('✅ ページ読み込み完了');

            // Check ethers.js
            console.log('ethers.js loaded:', typeof ethers !== 'undefined');
            if (typeof ethers === 'undefined') {
                showDiagnostic('❌ ethers.jsが読み込まれていません', true);
                showStatus('⚠️ ethers.jsの読み込みに失敗しました。ページを再読み込みしてください。', 'error');
                return;
            } else {
                showDiagnostic('✅ ethers.js読み込み成功');
            }

            // Check window.ethereum
            console.log('window.ethereum:', window.ethereum);
            console.log('MetaMask detected:', window.ethereum && window.ethereum.isMetaMask);

            if (!window.ethereum) {
                showDiagnostic('❌ window.ethereumが見つかりません', true);
                showStatus('⚠️ MetaMask Mobileのブラウザで開いてください。', 'error');
                return;
            } else {
                showDiagnostic('✅ window.ethereum検出成功');
            }

            if (window.ethereum.isMetaMask) {
                showDiagnostic('✅ MetaMask検出成功');
            }

            // Setup button click listener
            const connectBtn = document.getElementById('connectButton');
            if (connectBtn) {
                showDiagnostic('✅ 接続ボタンが見つかりました');
                connectBtn.addEventListener('click', async () => {
                    showDiagnostic('🔘 ボタンがタップされました！');
                    await connectWallet();
                });
                showDiagnostic('✅ ボタンイベントリスナー設定完了');
            } else {
                showDiagnostic('❌ 接続ボタンが見つかりません', true);
            }

            // Auto-connect if on mobile and already connected
            if (window.ethereum && window.ethereum.isMetaMask) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    console.log('Already connected accounts:', accounts);
                    if (accounts.length > 0) {
                        console.log('Auto-connecting...');
                        showDiagnostic('🔄 自動接続を試みています...');
                        await connectWallet();
                    } else {
                        showDiagnostic('👆 「MetaMaskで接続」ボタンをタップしてください');
                    }
                } catch (error) {
                    console.error('Auto-connect error:', error);
                    showDiagnostic('⚠️ 自動接続チェックでエラー: ' + error.message, true);
                }
            }
        });
    </script>
</body>
</html>
