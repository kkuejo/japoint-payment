<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPOINT 決済ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
        }

        .nav-link {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-link a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            transition: background 0.3s;
        }

        .nav-link a:hover {
            background: rgba(255,255,255,0.3);
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .summary-card .label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .summary-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .summary-card .value.jpyc {
            color: #2196F3;
        }

        .summary-card .value.japt {
            color: #4CAF50;
        }

        .summary-card .value.company {
            color: #9C27B0;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            color: #666;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .tx-hash {
            font-family: monospace;
            font-size: 12px;
            color: #667eea;
        }

        .address {
            font-family: monospace;
            font-size: 12px;
        }

        .plan-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .plan-badge.transfer5 {
            background: #e8f5e9;
            color: #4CAF50;
        }

        .plan-badge.transfer10 {
            background: #e3f2fd;
            color: #2196F3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .pagination button:hover {
            background: #f8f9fa;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            padding: 8px 16px;
            color: #666;
        }

        @media (max-width: 768px) {
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JAPOINT 決済ダッシュボード</h1>
        <p class="subtitle">決済履歴と収益分析</p>

        <div class="nav-link">
            <a href="index.html">← メインページに戻る</a>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card">
                <div class="label">総取引数</div>
                <div class="value" id="totalTransactions">-</div>
            </div>
            <div class="summary-card">
                <div class="label">総決済額 (JPYC)</div>
                <div class="value jpyc" id="totalJpyc">-</div>
            </div>
            <div class="summary-card">
                <div class="label">総還元 (JAPT)</div>
                <div class="value japt" id="totalJapt">-</div>
            </div>
            <div class="summary-card">
                <div class="label">ショップ売上</div>
                <div class="value" id="totalShopRevenue">-</div>
            </div>
            <div class="summary-card">
                <div class="label">会社収益</div>
                <div class="value company" id="totalCompanyRevenue">-</div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="section">
            <h2>日別推移</h2>
            <div class="chart-container">
                <canvas id="dailyChart"></canvas>
            </div>
        </div>

        <!-- Payments Table -->
        <div class="section">
            <h2>決済履歴</h2>

            <div class="filters">
                <div class="filter-group">
                    <label>開始日</label>
                    <input type="date" id="filterFrom">
                </div>
                <div class="filter-group">
                    <label>終了日</label>
                    <input type="date" id="filterTo">
                </div>
                <div class="filter-group">
                    <label>プラン</label>
                    <select id="filterPlanType">
                        <option value="">すべて</option>
                        <option value="transfer5">0.5%還元</option>
                        <option value="transfer10">1%還元</option>
                    </select>
                </div>
                <div class="filter-group" style="justify-content: flex-end;">
                    <button class="btn btn-primary" onclick="loadPayments()">検索</button>
                </div>
            </div>

            <div id="paymentsTable">
                <div class="loading">読み込み中...</div>
            </div>

            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevBtn" onclick="changePage(-1)">前へ</button>
                <span id="pageInfo"></span>
                <button id="nextBtn" onclick="changePage(1)">次へ</button>
            </div>
        </div>
    </div>

    <script>
        // API URL
        const API_URL = 'https://japoint-api.kkuejo.workers.dev';

        let currentPage = 0;
        const pageSize = 20;
        let totalPayments = 0;
        let dailyChart = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Set default date range (last 30 days)
            const today = new Date();
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

            document.getElementById('filterTo').value = today.toISOString().split('T')[0];
            document.getElementById('filterFrom').value = thirtyDaysAgo.toISOString().split('T')[0];

            loadSummary();
            loadDailyData();
            loadPayments();
        });

        // Format number with commas
        function formatNumber(num) {
            return Math.floor(num).toLocaleString('ja-JP');
        }

        // Load summary data
        async function loadSummary() {
            try {
                const from = document.getElementById('filterFrom').value;
                const to = document.getElementById('filterTo').value;

                let url = `${API_URL}/api/payments/summary`;
                const params = new URLSearchParams();
                if (from) params.set('from', from);
                if (to) params.set('to', to);
                if (params.toString()) url += '?' + params.toString();

                const response = await fetch(url);
                const data = await response.json();

                document.getElementById('totalTransactions').textContent = formatNumber(data.totals.transactionCount);
                document.getElementById('totalJpyc').textContent = formatNumber(data.totals.totalJpyc) + ' JPYC';
                document.getElementById('totalJapt').textContent = formatNumber(data.totals.totalJapt) + ' JAPT';
                document.getElementById('totalShopRevenue').textContent = formatNumber(data.totals.totalShopRevenue) + ' JPYC';
                document.getElementById('totalCompanyRevenue').textContent = formatNumber(data.totals.totalCompanyRevenue) + ' JPYC';

            } catch (error) {
                console.error('Error loading summary:', error);
            }
        }

        // Load daily chart data
        async function loadDailyData() {
            try {
                const from = document.getElementById('filterFrom').value;
                const to = document.getElementById('filterTo').value;

                let url = `${API_URL}/api/payments/daily`;
                const params = new URLSearchParams();
                if (from) params.set('from', from);
                if (to) params.set('to', to);
                if (params.toString()) url += '?' + params.toString();

                const response = await fetch(url);
                const data = await response.json();

                // Process data for chart
                const dailyData = {};
                for (const row of data.dailySummary) {
                    if (!dailyData[row.date]) {
                        dailyData[row.date] = { jpyc: 0, japt: 0, company: 0 };
                    }
                    dailyData[row.date].jpyc += parseFloat(row.total_jpyc) || 0;
                    dailyData[row.date].japt += parseFloat(row.total_japt) || 0;
                    dailyData[row.date].company += parseFloat(row.total_company_revenue) || 0;
                }

                const labels = Object.keys(dailyData).sort();
                const jpycData = labels.map(d => dailyData[d].jpyc);
                const japtData = labels.map(d => dailyData[d].japt);
                const companyData = labels.map(d => dailyData[d].company);

                // Create/update chart
                const ctx = document.getElementById('dailyChart').getContext('2d');

                if (dailyChart) {
                    dailyChart.destroy();
                }

                dailyChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '決済額 (JPYC)',
                                data: jpycData,
                                borderColor: '#2196F3',
                                backgroundColor: 'rgba(33, 150, 243, 0.1)',
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: '会社収益 (JPYC)',
                                data: companyData,
                                borderColor: '#9C27B0',
                                backgroundColor: 'rgba(156, 39, 176, 0.1)',
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Error loading daily data:', error);
            }
        }

        // Load payments
        async function loadPayments() {
            try {
                const from = document.getElementById('filterFrom').value;
                const to = document.getElementById('filterTo').value;
                const planType = document.getElementById('filterPlanType').value;

                let url = `${API_URL}/api/payments`;
                const params = new URLSearchParams();
                if (from) params.set('from', from);
                if (to) params.set('to', to);
                if (planType) params.set('planType', planType);
                params.set('limit', pageSize);
                params.set('offset', currentPage * pageSize);

                url += '?' + params.toString();

                const response = await fetch(url);
                const data = await response.json();

                totalPayments = data.pagination.total;
                renderPaymentsTable(data.payments);
                updatePagination();

                // Also reload summary and chart
                loadSummary();
                loadDailyData();

            } catch (error) {
                console.error('Error loading payments:', error);
                document.getElementById('paymentsTable').innerHTML = '<div class="loading">データの読み込みに失敗しました</div>';
            }
        }

        // Render payments table
        function renderPaymentsTable(payments) {
            if (payments.length === 0) {
                document.getElementById('paymentsTable').innerHTML = '<div class="loading">決済データがありません</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>日時</th>
                            <th>送信者</th>
                            <th>決済額</th>
                            <th>還元</th>
                            <th>会社収益</th>
                            <th>プラン</th>
                            <th>TX</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const payment of payments) {
                const date = new Date(payment.block_timestamp * 1000).toLocaleString('ja-JP');
                const shortSender = payment.sender_address.slice(0, 6) + '...' + payment.sender_address.slice(-4);
                const shortTx = payment.tx_hash.slice(0, 8) + '...';

                html += `
                    <tr>
                        <td>${date}</td>
                        <td class="address">${shortSender}</td>
                        <td>${formatNumber(parseFloat(payment.total_amount))} JPYC</td>
                        <td style="color: #4CAF50;">${formatNumber(parseFloat(payment.japt_amount))} JAPT</td>
                        <td style="color: #9C27B0;">${formatNumber(parseFloat(payment.company_amount))} JPYC</td>
                        <td><span class="plan-badge ${payment.plan_type}">${payment.plan_type === 'transfer5' ? '0.5%' : '1%'}</span></td>
                        <td><a href="https://sepolia.etherscan.io/tx/${payment.tx_hash}" target="_blank" class="tx-hash">${shortTx}</a></td>
                    </tr>
                `;
            }

            html += '</tbody></table>';
            document.getElementById('paymentsTable').innerHTML = html;
        }

        // Update pagination
        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(totalPayments / pageSize);

            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'flex';
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
            document.getElementById('pageInfo').textContent = `${currentPage + 1} / ${totalPages} ページ`;
        }

        // Change page
        function changePage(delta) {
            currentPage += delta;
            loadPayments();
        }
    </script>
</body>
</html>
