<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPT トークンを追加</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .token-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .token-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .token-row:last-child {
            margin-bottom: 0;
        }

        .token-label {
            color: #666;
            font-size: 14px;
        }

        .token-value {
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .address {
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            background: #e9ecef;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .add-button {
            width: 100%;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .add-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .add-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            display: block;
            background: #cce5ff;
            color: #004085;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            color: #4CAF50;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .manual-instructions {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 13px;
            color: #856404;
            text-align: left;
            display: none;
        }

        .manual-instructions h3 {
            margin-bottom: 10px;
        }

        .manual-instructions ol {
            padding-left: 20px;
        }

        .manual-instructions li {
            margin-bottom: 5px;
        }

        .copy-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🦊</div>
        <h1>JAPTトークンを追加</h1>
        <p class="subtitle">MetaMaskにJAPTを登録します</p>

        <div class="token-info">
            <div class="token-row">
                <span class="token-label">トークン名</span>
                <span class="token-value">JAPoint</span>
            </div>
            <div class="token-row">
                <span class="token-label">シンボル</span>
                <span class="token-value">JAPT</span>
            </div>
            <div class="token-row">
                <span class="token-label">小数点</span>
                <span class="token-value">18</span>
            </div>
            <div class="token-row">
                <span class="token-label">ネットワーク</span>
                <span class="token-value">Sepolia</span>
            </div>
            <div class="address" id="tokenAddress">
                0x0db3A45B333112a34fF81eE9B6A86AC1385d37C4
            </div>
            <button class="copy-btn" onclick="copyAddress()">アドレスをコピー</button>
        </div>

        <div id="networkStatus" style="margin-bottom: 15px; padding: 10px; border-radius: 8px; font-size: 14px; display: none;"></div>

        <button class="add-button" id="switchButton" onclick="doSwitchNetwork()" style="display: none; background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); margin-bottom: 10px;">
            <span>🔄</span>
            <span>Sepoliaに切り替える</span>
        </button>

        <button class="add-button" id="addButton" onclick="addToken()">
            <span>🦊</span>
            <span>MetaMaskに追加</span>
        </button>

        <div class="status" id="status"></div>

        <div class="manual-instructions" id="manualInstructions">
            <h3>手動で追加する方法:</h3>
            <ol>
                <li>MetaMaskでSepoliaネットワークに切り替える</li>
                <li>「トークンをインポート」をタップ</li>
                <li>上記のアドレスを貼り付け</li>
                <li>シンボル: JAPT、小数点: 18</li>
                <li>「インポート」をタップ</li>
            </ol>
        </div>

        <a href="index.html" class="back-link">← メインページに戻る</a>
    </div>

    <script>
        const JAPT_ADDRESS = '0x0db3A45B333112a34fF81eE9B6A86AC1385d37C4';
        const SEPOLIA_CHAIN_ID = '0xaa36a7'; // 11155111

        let isOnSepolia = false;

        // Update UI based on current network
        function updateNetworkUI(chainId) {
            const networkStatus = document.getElementById('networkStatus');
            const switchButton = document.getElementById('switchButton');
            const addButton = document.getElementById('addButton');

            isOnSepolia = (chainId === SEPOLIA_CHAIN_ID);

            networkStatus.style.display = 'block';

            if (isOnSepolia) {
                networkStatus.style.background = '#d4edda';
                networkStatus.style.color = '#155724';
                networkStatus.textContent = 'Sepolia Testnet に接続中';
                switchButton.style.display = 'none';
                addButton.style.display = 'flex';
                addButton.disabled = false;
            } else {
                const chainName = getChainName(chainId);
                networkStatus.style.background = '#f8d7da';
                networkStatus.style.color = '#721c24';
                networkStatus.textContent = chainName + ' に接続中 — JAPTトークンはSepoliaにあります';
                switchButton.style.display = 'flex';
                addButton.style.display = 'none';
            }
        }

        function getChainName(chainId) {
            const names = {
                '0x1': 'Ethereum Mainnet',
                '0x89': 'Polygon',
                '0xa4b1': 'Arbitrum',
                '0xa': 'Optimism',
                '0xaa36a7': 'Sepolia',
            };
            return names[chainId] || 'Chain ' + parseInt(chainId, 16);
        }

        async function doSwitchNetwork() {
            const switchButton = document.getElementById('switchButton');
            try {
                switchButton.disabled = true;
                switchButton.innerHTML = '<span>🔄</span><span>切り替え中...</span>';
                showStatus('MetaMaskでネットワーク切り替えを承認してください', 'info');

                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: SEPOLIA_CHAIN_ID }],
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: SEPOLIA_CHAIN_ID,
                                chainName: 'Sepolia Testnet',
                                nativeCurrency: { name: 'SepoliaETH', symbol: 'ETH', decimals: 18 },
                                rpcUrls: ['https://rpc.sepolia.org'],
                                blockExplorerUrls: ['https://sepolia.etherscan.io'],
                            }],
                        });
                    } else {
                        throw switchError;
                    }
                }

                // After switch, re-check (page may reload on Mobile)
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                updateNetworkUI(chainId);

                if (chainId === SEPOLIA_CHAIN_ID) {
                    showStatus('Sepoliaに切り替わりました。「MetaMaskに追加」をタップしてください', 'info');
                }
            } catch (error) {
                if (error.code === 4001) {
                    showStatus('切り替えがキャンセルされました', 'error');
                } else {
                    showStatus('エラー: ' + error.message, 'error');
                }
            } finally {
                switchButton.disabled = false;
                switchButton.innerHTML = '<span>🔄</span><span>Sepoliaに切り替える</span>';
            }
        }

        async function addToken() {
            const button = document.getElementById('addButton');
            const manualInstructions = document.getElementById('manualInstructions');

            if (typeof window.ethereum === 'undefined') {
                showStatus('MetaMaskがインストールされていません。手動で追加してください。', 'error');
                manualInstructions.style.display = 'block';
                return;
            }

            // Final network check right before adding
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (chainId !== SEPOLIA_CHAIN_ID) {
                updateNetworkUI(chainId);
                showStatus('先にSepoliaネットワークに切り替えてください', 'error');
                return;
            }

            try {
                button.disabled = true;
                button.innerHTML = '<span>🔄</span><span>追加中...</span>';
                showStatus('MetaMaskを確認してください...', 'info');

                // Try standard format first
                let wasAdded = false;
                try {
                    wasAdded = await window.ethereum.request({
                        method: 'wallet_watchAsset',
                        params: {
                            type: 'ERC20',
                            options: {
                                address: JAPT_ADDRESS,
                                symbol: 'JAPT',
                                decimals: 18,
                            },
                        },
                    });
                } catch (e1) {
                    console.log('Format 1 failed, trying format 2:', e1.message);
                    // Try alternate format (some MetaMask versions expect this)
                    wasAdded = await window.ethereum.request({
                        method: 'wallet_watchAsset',
                        params: [
                            {
                                type: 'ERC20',
                                options: {
                                    address: JAPT_ADDRESS,
                                    symbol: 'JAPT',
                                    decimals: 18,
                                },
                            }
                        ],
                    });
                }

                if (wasAdded) {
                    showStatus('JAPTトークンが追加されました！', 'success');
                } else {
                    showStatus('トークンの追加がキャンセルされました', 'error');
                }

            } catch (error) {
                console.error('Error adding token:', error);
                if (error.code === 4001) {
                    showStatus('ユーザーがキャンセルしました', 'error');
                } else {
                    showStatus('[' + (error.code || '?') + '] ' + error.message + ' — 手動で追加してください。', 'error');
                    manualInstructions.style.display = 'block';
                }
            } finally {
                button.disabled = false;
                button.innerHTML = '<span>🦊</span><span>MetaMaskに追加</span>';
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function copyAddress() {
            const address = document.getElementById('tokenAddress').textContent.trim();
            navigator.clipboard.writeText(address).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'コピーしました！';
                setTimeout(() => {
                    btn.textContent = 'アドレスをコピー';
                }, 2000);
            }).catch(err => {
                console.error('Copy failed:', err);
                alert('コピーに失敗しました: ' + address);
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.ethereum) return;

            try {
                // Connect
                await window.ethereum.request({ method: 'eth_requestAccounts' });

                // Check current network and update UI
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                updateNetworkUI(chainId);

                // Listen for network changes (works on both Desktop and Mobile)
                window.ethereum.on('chainChanged', (newChainId) => {
                    updateNetworkUI(newChainId);
                    if (newChainId === SEPOLIA_CHAIN_ID) {
                        showStatus('Sepoliaに切り替わりました。「MetaMaskに追加」をタップしてください', 'info');
                    }
                });

            } catch (e) {
                // Not connected yet - show add button anyway
                document.getElementById('addButton').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
